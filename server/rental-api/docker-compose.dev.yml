services:
  xniu-mysql:
    image: mysql:8.4
    container_name: xniu-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: xniu_rental
    ports:
      - "3310:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - xniu_mysql_data:/var/lib/mysql

  xniu-redis:
    image: redis:7-alpine
    container_name: xniu-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - xniu_redis_data:/data

volumes:
  xniu_mysql_data:
  xniu_redis_data:

